steps:
  # ── Build and push the Docker image ─────────────────────────────────────────
  - name: 'gcr.io/cloud-builders/docker'
    id: build-image
    args:
      - build
      - --file=release/gcp/content-factory/Dockerfile.cloudrun
      - --tag=$_IMAGE
      - --cache-from=$_IMAGE
      - .
    # Build context is the repo root so COPY content-factory/ works correctly

  - name: 'gcr.io/cloud-builders/docker'
    id: push-image
    args: ['push', '$_IMAGE']
    waitFor: ['build-image']

  # ── Deploy to Cloud Run ──────────────────────────────────────────────────────
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: deploy-cloudrun
    entrypoint: gcloud
    args:
      - run
      - deploy
      - content-factory-backend
      - --image=$_IMAGE
      - --region=$_REGION
      - --project=$PROJECT_ID
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --allow-unauthenticated
      - --ingress=all
      - --service-account=$_SA_EMAIL
      - >-
        --set-secrets=GEMINI_API_KEY=factory-gemini-api-key:latest,FACTORY_SYNC_SECRET=factory-sync-secret:latest,JWT_SECRET=gg-cms-jwt-secret:latest
      - >-
        --set-env-vars=GGCMS_BASE_URL=$_GGCMS_BASE_URL,MOCK_MODE=false,GEMINI_MODEL_PLANNER=gemini-2.0-flash,GEMINI_MODEL_RESEARCHER=gemini-2.0-flash,GEMINI_MODEL_WRITER=gemini-2.0-flash,GEMINI_MODEL_REVIEWER=gemini-2.0-flash,GDRIVE_ENABLED=true,LOG_LEVEL=info,DATA_DIR=/app/data
    waitFor: ['push-image']

substitutions:
  _REGION: us-central1
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/gg-cms/content-factory:latest
  _SA_EMAIL: content-factory-sa@${PROJECT_ID}.iam.gserviceaccount.com
  _GGCMS_BASE_URL: https://gg-cms-backend-274495931884.us-central1.run.app

options:
  logging: CLOUD_LOGGING_ONLY
