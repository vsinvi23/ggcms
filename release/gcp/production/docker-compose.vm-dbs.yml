version: '3.8'

# ==============================================================================
# GG-CMS & CertAxis — Consolidated VM Databases for Free-Tier Production
# Runs on single e2-micro VM (1GB RAM) with memory caps and Linux swap
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: gg-cms-postgres-prod
    restart: always
    mem_limit: 260m
    environment:
      POSTGRES_USER: gg_cms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gg_cms
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /opt/gg-cms/certs/postgres:/etc/postgresql/certs:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=50"
      - "-c"
      - "shared_buffers=64MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=16MB"
      - "-c"
      - "ssl=on"
      - "-c"
      - "ssl_cert_file=/etc/postgresql/certs/server.crt"
      - "-c"
      - "ssl_key_file=/etc/postgresql/certs/server.key"
      - "-c"
      - "ssl_ca_file=/etc/postgresql/certs/ca.crt"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gg_cms_user -d gg_cms"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: gg-cms-mongo-prod
    restart: always
    mem_limit: 350m
    environment:
      MONGO_INITDB_ROOT_USERNAME: gg_cms_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: gg_cms
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - /opt/gg-cms/certs/mongodb:/etc/mongodb/certs:ro
    command: >
      mongod
      --wiredTigerCacheSizeGB 0.25
      --tlsMode allowTLS
      --tlsCertificateKeyFile /etc/mongodb/certs/mongodb.pem
      --tlsCAFile /etc/mongodb/certs/ca.crt
      --tlsAllowConnectionsWithoutCertificates
      --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: certaxis-redis
    restart: always
    mem_limit: 90m
    ports:
      - "6380:6379"
    volumes:
      - certaxis-redis-data:/data
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata:
  certaxis-redis-data:
