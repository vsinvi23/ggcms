version: '3.8'

# ==============================================================================
# GG-CMS — VM Databases (PostgreSQL + MongoDB) for Test / Staging Environment
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: gg-cms-postgres-test
    restart: always
    environment:
      POSTGRES_USER: gg_cms_test_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gg_cms_test
    ports:
      - "5432:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gg_cms_test_user -d gg_cms_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: gg-cms-mongo-test
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: gg_cms_test_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: gg_cms_test
    ports:
      - "27017:27017"
    volumes:
      - mongodata_test:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_test:
  mongodata_test:
