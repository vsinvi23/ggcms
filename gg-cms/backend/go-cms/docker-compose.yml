name: gg-cms

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: gg-cms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gg_cms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: gg_cms
    ports:
      - "127.0.0.1:5433:5432"   # host:5433 → container:5432 (avoids conflict with other postgres instances)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres/001_initial_schema_reset.sql:/docker-entrypoint-initdb.d/001_initial_schema_reset.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gg_cms_user -d gg_cms"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0.14-jammy
    container_name: gg-cms-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: gg_cms_user
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: gg_cms
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: pgAdmin for DB inspection
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: gg-cms-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  postgres_data:
  mongo_data:
